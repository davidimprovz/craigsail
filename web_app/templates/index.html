<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craigsail Map</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 70vh; width: 100%; border-radius: .25rem; }
        .controls { margin: 1rem 0; }
        .legend {
            background: #fff; padding: .5rem .75rem; line-height: 1.6;
            border-radius: .25rem; box-shadow: 0 0 8px rgba(0,0,0,.2); font-size: .85rem;
        }
        .legend .swatch {
            display: inline-block; width: 12px; height: 12px;
            border-radius: 50%; margin-right: .4rem; border: 1px solid #555;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h4 class="mt-3">Craigsail listings</h4>

        <div class="form-row controls">
            <div class="col-auto">
                <select id="category" class="form-control">
                    <option value="">All categories</option>
                </select>
            </div>
            <div class="col-auto">
                <select id="city" class="form-control">
                    <option value="">All cities</option>
                </select>
            </div>
            <div class="col-auto d-flex align-items-center">
                <span id="status" class="text-muted"></span>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
    $(function () {
        var map = L.map('map').setView([37.7749, -122.4194], 5);
        var markerLayer = L.layerGroup().addTo(map);
        var legend = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Cheap green -> red ramp: cheapest listings green, priciest red.
        function priceColor(price, min, max) {
            if (price === null || min === null || max === null || max === min) { return '#3388ff'; }
            var ratio = (price - min) / (max - min);
            var hue = (1 - ratio) * 120;  // 120deg green .. 0deg red
            return 'hsl(' + hue + ', 80%, 45%)';
        }

        function money(value) {
            return value === null ? 'no price' : '$' + value.toLocaleString();
        }

        function drawLegend(min, max) {
            if (legend) { map.removeControl(legend); legend = null; }
            if (min === null || max === null) { return; }

            legend = L.control({ position: 'bottomright' });
            legend.onAdd = function () {
                var div = L.DomUtil.create('div', 'legend');
                div.innerHTML = '<strong>Price</strong><br>' +
                    '<span class="swatch" style="background:' + priceColor(min, min, max) + '"></span>' + money(min) + '<br>' +
                    '<span class="swatch" style="background:' + priceColor(max, min, max) + '"></span>' + money(max);
                return div;
            };
            legend.addTo(map);
        }

        function loadMap() {
            $('#status').text('loading...');

            $.getJSON('/map', {
                category: $('#category').val(),
                city: $('#city').val()
            }).done(function (data) {
                markerLayer.clearLayers();

                data.markers.forEach(function (m) {
                    L.circleMarker(m.location, {
                        radius: 7,
                        color: '#333',
                        weight: 1,
                        fillColor: priceColor(m.price, data.price_min, data.price_max),
                        fillOpacity: 0.85
                    })
                    .bindPopup(
                        '<strong>' + $('<div>').text(m.name).html() + '</strong><br>' +
                        money(m.price) + '<br>' +
                        $('<div>').text(m.where || m.city).html() + '<br>' +
                        '<a href="' + m.url + '" target="_blank" rel="noopener">view posting</a>'
                    )
                    .addTo(markerLayer);
                });

                // Fit to the markers rather than guessing a zoom - listings
                // can span a single marina or the whole west coast.
                if (data.count === 1) {
                    map.setView(data.markers[0].location, 12);
                } else if (data.count > 1) {
                    map.fitBounds(
                        L.latLngBounds(data.markers.map(function (m) { return m.location; })),
                        { padding: [40, 40] }
                    );
                }
                drawLegend(data.price_min, data.price_max);
                $('#status').text(data.count + ' listings');
            }).fail(function () {
                $('#status').text('failed to load listings');
            });
        }

        $.getJSON('/categories').done(function (data) {
            data.categories.forEach(function (c) {
                $('#category').append($('<option>').val(c).text(c));
            });
            data.cities.forEach(function (c) {
                $('#city').append($('<option>').val(c).text(c));
            });
        }).always(loadMap);

        $('#category, #city').on('change', loadMap);
    });
    </script>
</body>
</html>
