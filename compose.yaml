services:
  web:
    build: .
    image: craigsail:latest
    ports:
      # host 5001: macOS AirPlay Receiver squats on 5000
      - "5001:5000"
    volumes:
      - craigsail-data:/app/data
    environment:
      CRAIGSAIL_DB: /app/data/craigsail.db

  # One-shot search runs, e.g.:
  #   docker compose run --rm search \
  #     --search_category boo --data_path /app/data --cities sfbay seattle
  search:
    build: .
    image: craigsail:latest
    profiles: ["search"]
    entrypoint: ["craigsail"]
    volumes:
      - craigsail-data:/app/data

volumes:
  craigsail-data:
