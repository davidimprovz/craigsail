services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: craigsail-backend
    ports:
      - "8008:8000" # Mapped to 8008 to avoid conflicts
    volumes:
      - ./backend:/app
      - ./data:/data 
    environment:
      - DATA_PATH=/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: craigsail-frontend
    ports:
      - "3003:80" # Mapped to 3003 to avoid conflicts
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
