[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "craigsail"
version = "0.1.0"
description = "Track craigslist items and use statistical patterns to optimize sales and purchases."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "pandas>=2.0",
    "python-craigslist>=1.1.4",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
craigsail = "craigsail.cli:main"

[tool.setuptools]
packages = ["craigsail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
